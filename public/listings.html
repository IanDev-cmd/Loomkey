<!DOCTYPE html>
<html lang="en">
<head>

<style>
:root{
  --indigo:#2e1aba; --indigo-sel:#5a47d9; --ink:#1d1d36; --ink2:#2f2f46; --mute:#8e8fa8; --mute2:#a4a6bc;
  --line:#eceef5; --bg-page:#d5d6eb; --bg-main:#f7f8fc; --lav:#f0edff; --lav-r:#e5e0ff; --gold:#f7b500;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;height:100%;background:var(--bg-page);overflow:hidden;font-family:'Figtree','Circular Std','Helvetica Neue',Arial,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;position:relative}
#stage{--WW:660px;--H:409px;--dy:0px;position:absolute;left:50%;top:50%;width:736px;height:552px;transform-origin:50% 50%;transform:translate(-50%,-50%)}
#stage svg.blob{position:absolute;left:0;top:0;width:736px;height:552px;overflow:visible}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a.nav{text-decoration:none}
a#upbtn,a#probtn{display:flex;align-items:center;justify-content:center;text-decoration:none}
button:focus-visible,[tabindex]:focus-visible{outline:1px solid var(--indigo-sel);outline-offset:1px}
svg.i{fill:none;stroke:currentColor;stroke-width:1.1;stroke-linecap:round;stroke-linejoin:round}

/* window: stage (38,71) 660x409 */
#win{--cw:491px;position:absolute;left:38px;top:71px;width:var(--WW);height:var(--H);background:var(--bg-main);border-radius:8px;overflow:hidden;box-shadow:0 22px 44px rgba(72,62,150,.13),0 2px 10px rgba(72,62,150,.06)}
.abs{position:absolute}

/* sidebar */
#side{left:0;top:0;width:117px;height:var(--H);background:#fff;border-right:1px solid #f0f1f8}
#logo{left:16px;top:16.5px;width:14.5px;height:14.5px;border-radius:3.5px;background:#2a19ad;color:#fff;font-weight:700;font-size:calc(var(--fs,1)*7.6px);display:flex;align-items:center;justify-content:center}
#brand{left:37.5px;top:24px;transform:translateY(-50%);font-size:calc(var(--fs,1)*8.4px);font-weight:700;color:#1d1d36;white-space:nowrap}
.nav{left:0;width:117px;height:20px;transform:translateY(-50%);display:flex;align-items:center;cursor:default;color:var(--mute)}
.nav svg{position:absolute;left:15.5px;width:10.4px;height:10.4px}
.nav span{position:absolute;left:37.5px;font-size:calc(var(--fs,1)*7.7px);font-weight:540;white-space:nowrap}
.nav:hover{color:#5b5c78}
.nav.on{color:#2a19ad}
.nav.on span{color:#1d1d36}
#navbar{left:114.3px;top:66.8px;width:2.5px;height:14px;background:var(--indigo);border-radius:1px}
#upg{left:10.4px;top:calc(276px + var(--dy));width:95.2px;height:124.6px;background:var(--lav);border-radius:4.5px;overflow:hidden}
#upg .R{position:absolute;left:11px;top:-8px;font-size:156px;font-weight:800;line-height:1;color:var(--lav-r);user-select:none}
#ill{left:40px;top:calc(262px + var(--dy));width:34px;height:61px;pointer-events:none}
.ut{left:0;width:117px;text-align:center;transform:translateY(-50%);white-space:nowrap}
#ut1{top:calc(333.4px + var(--dy));font-size:calc(var(--fs,1)*8px);font-weight:700;color:#3b2fa0}
#ut2{top:calc(347px + var(--dy));font-size:calc(var(--fs,1)*6.6px);font-weight:600;color:#4b3fa6}
#ut3{top:calc(356.4px + var(--dy));font-size:calc(var(--fs,1)*6.6px);font-weight:600;color:#4b3fa6}
#upbtn{left:37px;top:calc(368px + var(--dy));width:41px;height:18px;border-radius:5px;background:var(--indigo);color:#fff;font-size:calc(var(--fs,1)*7.5px);font-weight:600;transition:transform .08s,background .15s}
#upbtn:hover,#probtn:hover{background:#3a27cc}
#upbtn:active,#probtn:active{transform:scale(.96)}

/* main */
#search{left:143px;top:13px;width:var(--cw);height:36px;background:#fff;border-radius:5px;box-shadow:0 1px 7px rgba(80,80,150,.05)}
#search svg{position:absolute;left:14px;top:13px;width:10px;height:10px;color:#a9abc2;stroke-width:1.15}
#q{position:absolute;left:32px;top:0;height:36px;width:300px;border:0;outline:0;background:transparent;font-family:'Figtree',sans-serif;font-weight:500;font-size:calc(var(--fs,1)*7.5px);color:var(--ink2)}
#q::placeholder{color:#aeb0c6;opacity:1}
#h1{left:143px;top:77px;transform:translateY(-50%);font-size:calc(var(--fs,1)*12.6px);font-weight:540;color:#1d1d36;margin:0;white-space:nowrap}
#tog{left:395px;top:68px;width:91px;height:18px;border-radius:5px;background:#f2f3fa;border:1px solid #eceef6;display:flex;padding:0}
#tog button{height:16px;font-size:calc(var(--fs,1)*7px);font-weight:600;color:#8e8fa8;border-radius:5px;position:relative}
#tog button[aria-selected=true]{color:#1d1d36;background:#fff;box-shadow:0 0 0 1px #eceef6,0 1px 3px rgba(80,80,150,.08)}
#tab-a{width:44px}#tab-i{width:45px}
#list{left:143px;top:105px;width:var(--cw);display:flex;flex-direction:column;gap:8.6px}
.card{position:relative;height:80px;background:#fff;border-radius:6px;box-shadow:0 1px 8px rgba(70,70,140,.045);cursor:pointer;text-align:left;display:block;width:100%}
.card.sel::after{content:"";position:absolute;inset:0;border:1.5px solid var(--indigo-sel);border-radius:6px;pointer-events:none}
.card.sel{box-shadow:0 3px 12px rgba(70,60,160,.08)}
.card img.ph{position:absolute;left:11px;top:11px;width:65px;height:59px;border-radius:3px;object-fit:cover;display:block}
.nm{position:absolute;left:88px;top:17px;transform:translateY(-50%);display:flex;align-items:center;white-space:nowrap}
.nm b{font-size:calc(var(--fs,1)*9.6px);font-weight:600;color:#1d1d36}
.stars{display:flex;margin-left:8px}
.stars svg{width:8px;height:8px;margin-right:1px;fill:var(--gold);stroke:none}
.stars svg.e{fill:#fff;stroke:#d8d9e6;stroke-width:.9}
.ad{position:absolute;left:89px;top:30px;transform:translateY(-50%);display:flex;align-items:center;font-size:calc(var(--fs,1)*6.4px);font-weight:500;color:#9b9db4;white-space:nowrap}
.ad svg{width:6.2px;height:6.2px;margin-right:2.4px}
.st{position:absolute;top:54px;display:flex;align-items:flex-start}
.st svg{width:10.5px;height:10.5px;color:#9899b4;position:absolute;top:1.5px;left:-1px}
.st .t{display:flex;flex-direction:column;white-space:nowrap}
.st .l{font-size:calc(var(--fs,1)*6px);font-weight:500;color:var(--mute2);line-height:8px;transform:translateY(-4px)}
.st .v{font-size:calc(var(--fs,1)*7.4px);font-weight:540;color:#34344c;line-height:10px;transform:translateY(-3px)}
.s1{left:89px}.s1 .t{margin-left:14px}
.s2{left:153px}.s2 .t{margin-left:15px}
.s3{left:246px}.s3 .t{margin-left:15.5px}
#pager{left:316px;top:376.7px;width:11px;height:11px;border:1px solid #c9cadc;border-radius:50%;background:transparent;transform:translate(-0px,0)}
#empty{left:143px;top:105px;width:var(--cw);text-align:center;font-size:calc(var(--fs,1)*7.5px);font-weight:500;color:var(--mute2);padding-top:40px}

/* detail panel: stage (511,71) 187x409 */
#panel{left:calc(var(--WW) - 187px);top:0;width:187px;height:var(--H);background:#fff;box-shadow:-10px 0 26px rgba(80,80,150,.10);transition:transform .22s cubic-bezier(.3,.7,.2,1),opacity .18s;z-index:5}
#panel.closed{transform:translateX(24px);opacity:0;pointer-events:none}
.key{position:absolute;top:12.5px;width:10.5px;height:11px;border:1px solid #e1e2ee;border-radius:2.6px;color:#b9bacd;display:flex;align-items:center;justify-content:center;font-size:calc(var(--fs,1)*4.2px);font-weight:600}
.key svg{width:6px;height:6px}
.kt{position:absolute;top:18px;transform:translateY(-50%);font-size:calc(var(--fs,1)*5.6px);font-weight:500;color:#b3b4c8;white-space:nowrap}
#ptitle{left:15px;top:46px;transform:translateY(-50%);margin:0;font-size:calc(var(--fs,1)*11.4px);font-weight:600;color:#1b1b33;white-space:nowrap}
#badge{top:41px;height:10px;border-radius:5px;background:#e3f8ea;color:#2f9e5f;font-size:calc(var(--fs,1)*5.4px);font-weight:600;display:flex;align-items:center;padding:0 4px 0 4px;white-space:nowrap;gap:2.2px;line-height:10px}
#badge i{width:2.6px;height:2.6px;border-radius:50%;background:#2f9e5f;display:block}
#paddr{left:16px;top:60px;transform:translateY(-50%);display:flex;align-items:center;font-size:calc(var(--fs,1)*6.3px);font-weight:500;color:#9b9db4;white-space:nowrap}
#paddr svg{width:6.4px;height:6.4px;margin-right:2.4px}
.hr{position:absolute;left:15px;width:159.5px;height:1px;background:#f0f1f7}
#av{left:15px;top:94px;width:18.5px;height:18.5px;border-radius:50%;overflow:hidden;background:#e7e9f6;display:flex;align-items:center;justify-content:center;font-size:calc(var(--fs,1)*6.5px);font-weight:700;color:#4b3fa6}
#av img{width:100%;height:100%;display:block;object-fit:cover}
#gn{left:37.5px;top:100px;transform:translateY(-50%);font-size:calc(var(--fs,1)*6.8px);font-weight:600;color:#2a2a40;white-space:nowrap}
#gl{left:37.5px;top:108px;transform:translateY(-50%);font-size:calc(var(--fs,1)*6px);font-weight:500;color:#a0a2b8;white-space:nowrap}
.dl{position:absolute;top:128px;transform:translateY(-50%);font-size:calc(var(--fs,1)*6px);font-weight:500;color:#b0b2c6;white-space:nowrap}
.dv{position:absolute;top:138px;transform:translateY(-50%);font-size:calc(var(--fs,1)*6.5px);font-weight:600;color:#2f2f46;white-space:nowrap}
#chev{left:70px;top:131.5px;width:5px;height:6.5px;color:#9a9cb4;stroke-width:1.1}
#tabs{left:15px;top:159px;width:158.5px;height:17px;border-radius:5px;background:#f5f5fb;border:1px solid #ebecf6;display:flex}
#tabs button{height:15px;font-size:calc(var(--fs,1)*6.6px);font-weight:500;color:#8c8ea6;border-radius:5px}
#tabs button[aria-selected=true]{background:#fff;color:#1d1d36;font-weight:600;box-shadow:0 0 0 1px #ebecf6,0 1px 3px rgba(80,80,150,.07)}
#t-c{width:51px}#t-d{width:56px}#t-b{width:49.5px}
#rows{left:0;top:184.75px;width:187px}
.row{height:33px;margin:0 13.5px 0 15px;padding:0;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #f0f1f7}
.row:last-child{border-bottom:0}
.row .lb{font-size:calc(var(--fs,1)*6.8px);font-weight:500;color:#6d6f88;white-space:nowrap}
.row .vv{font-size:calc(var(--fs,1)*7px);font-weight:600;color:#2f2f46;white-space:nowrap}
.digits{display:flex;gap:2.4px}
.dg{width:18px;height:18px;border-radius:4.5px;display:flex;align-items:center;justify-content:center;font-size:calc(var(--fs,1)*8.4px);font-weight:600}
.dg.a{background:#efedfc;color:#3a2fa8}
.dg.o{background:#fcf0d3;color:#a08b4e}
.dg.c{background:#fff;color:#2b2b3c;box-shadow:0 0 0 1px #eeeef5 inset}
.pill{height:13px;padding:0 6px;border-radius:4px;background:#efedfc;color:#3a2fa8;font-size:calc(var(--fs,1)*6.6px);font-weight:600}
.pill:hover{background:#e6e2fb}
#pfoot{left:0;top:calc(362px + var(--dy));width:187px;height:47px;border-top:1px solid var(--line)}
#pf-ic{left:15px;top:15.5px;width:18px;height:18px;border-radius:50%;background:#efedfb;color:#5b4bd6;display:flex;align-items:center;justify-content:center}
#pf-ic svg{width:9px;height:9px}
#pf1{left:36.5px;top:20.5px;transform:translateY(-50%);font-size:calc(var(--fs,1)*7.4px);font-weight:600;color:#2b2b42;white-space:nowrap}
#pf2{left:36.5px;top:30px;transform:translateY(-50%);font-size:calc(var(--fs,1)*6.2px);font-weight:500;color:#a3a5ba;white-space:nowrap}
#probtn{left:111.5px;top:15px;width:62px;white-space:nowrap;height:18px;border-radius:5px;background:var(--indigo);color:#fff;font-size:calc(var(--fs,1)*6.2px);font-weight:600;transition:transform .08s,background .15s}
.fade{transition:opacity .12s}
.fade.out{opacity:0}
@media (prefers-reduced-motion:reduce){#panel{transition:none}}
#sizer{left:calc(143px + var(--cw)/2 - 36px);top:1.5px;height:10.5px;display:flex;border-radius:5.5px;background:#fff;border:1px solid #e3e4f1;z-index:6;overflow:hidden}
#sizer button{padding:0 5px;font-size:calc(var(--fs,1)*5.2px);font-weight:600;color:#7a7b96;line-height:8.5px;white-space:nowrap}
#sizer button:hover{color:var(--indigo)}
#sizer button[aria-pressed=true]{background:#efedfc;color:var(--indigo)}
body.big #win{left:0;top:0;--cw:calc(var(--WW) - 169px)}
body.big #win.pop{--cw:calc(var(--WW) - 356px)}
body.big .blob{display:none}
body.big #stage{transform-origin:0 0}
body.m-x #win{border-radius:0;box-shadow:none}

body,body.big{background:#3a140c url("/img/bg.jpg?v=brush") center / cover no-repeat fixed !important}
#stage,#win{background:transparent !important;box-shadow:none !important}
.blob{display:none !important}
#logo,#brand,#navbar,#upg,#ill,.ut,#upbtn,#sizer{display:none !important}
#side{
  width:52px !important;background:transparent !important;border:0 !important;
  display:flex !important;flex-direction:column !important;justify-content:center !important;
  align-items:center !important;gap:8px !important;left:10px !important;z-index:8;
}
.nav{
  position:relative !important;left:auto !important;top:auto !important;width:28px !important;height:28px !important;
  transform:none !important;border-radius:8px !important;background:#f7f3ea !important;color:#3a3458 !important;
  box-shadow:0 10px 22px rgba(40,16,24,.22) !important;
}
.nav.on{color:#2e1aba !important;background:#fff !important}
.nav span{position:absolute !important;width:1px !important;height:1px !important;overflow:hidden !important;clip:rect(0,0,0,0) !important}
.nav svg{position:absolute !important;left:50% !important;top:50% !important;width:13px !important;height:13px !important;transform:translate(-50%,-50%) !important}
#h1{color:#fff !important;text-shadow:0 2px 12px rgba(30,8,12,.4)}
#search{background:#f7f3ea !important;border-radius:12px !important;box-shadow:0 14px 32px rgba(40,16,24,.2) !important}
#tog{background:#f7f3ea !important;border:0 !important;border-radius:8px !important;box-shadow:0 10px 22px rgba(40,16,24,.18) !important}
#list{gap:12px !important}
.card{background:#f7f3ea !important;border-radius:14px !important;box-shadow:0 14px 32px rgba(40,16,24,.2) !important}
#empty{color:#fff !important}
#pager{display:none !important}
#win{overflow:visible !important}
#panel{
  top:20px !important;height:calc(var(--H) - 40px) !important;left:auto !important;right:18px !important;width:187px !important;
  border-radius:16px !important;background:#f7f3ea !important;box-shadow:0 18px 40px rgba(40,16,24,.24) !important;overflow:hidden;
}
#pfoot{top:auto !important;bottom:0 !important}
body.phone{overflow:auto;height:auto}
body.phone #stage{position:relative !important;left:0 !important;top:0 !important;width:100% !important;height:auto !important;transform:none !important}
body.phone #win{position:relative !important;left:0 !important;top:0 !important;width:100% !important;height:auto !important;overflow:visible !important;padding:16px 16px calc(108px + env(safe-area-inset-bottom))}
body.phone #side{position:fixed !important;left:50% !important;top:auto !important;bottom:calc(12px + env(safe-area-inset-bottom)) !important;transform:translateX(-50%) !important;flex-direction:row !important;width:auto !important;height:auto !important;gap:8px !important;z-index:50}
body.phone .nav{width:44px !important;height:44px !important}
body.phone .nav svg{width:18px !important;height:18px !important}
body.phone #search,body.phone #h1,body.phone #tog,body.phone #list,body.phone #empty{position:relative !important;left:auto !important;top:auto !important;width:100% !important;margin:0 0 12px;transform:none !important}
body.phone #h1{font-size:28px !important}
body.phone #search{height:48px !important}
body.phone #q{height:48px !important;width:calc(100% - 48px) !important;font-size:16px !important}
body.phone #tog{width:max-content !important;height:36px !important}
body.phone #tog button{height:34px !important;font-size:14px !important}
body.phone .card{height:112px !important}
body.phone #panel{position:relative !important;top:auto !important;right:auto !important;left:auto !important;width:min(100%,420px) !important;height:480px !important;margin:8px 0 16px}

</style>
</head>
<body>
<div id="stage">
  <svg class="blob" viewBox="0 0 736 552" aria-hidden="true"><path fill="#7254fd" d="M-3000 -3000 H478 C488 28 492 52 489 71 C484 112 452 160 400 205 C300 290 150 350 38 410 L0 442 L-1500 1700 Z"/></svg>

  <div id="win">
    <!-- SIDEBAR -->
    <aside id="side" class="abs">
      <div id="logo" class="abs">R</div>
      <div id="brand" class="abs">Loomkey</div>

      <div id="navbar" class="abs"></div>
      <a class="nav on abs" href="/listings" style="top:74.3px" aria-current="page"><svg class="i" viewBox="0 0 12 12"><path d="M2 5v2.4h1.7L9.6 10.3V1.9L3.7 5H2z"/><path d="M3.9 7.5l.7 2.6"/></svg><span>Listings</span></a>
      <a class="nav abs" href="/dashboard" style="top:103px"><svg class="i" viewBox="0 0 12 12"><circle cx="6" cy="6" r="4.6"/><path d="M6 6l2.1-1.9"/></svg><span>Dashboard</span></a>
      <a class="nav abs" href="/providers" style="top:133px"><svg class="i" viewBox="0 0 12 12"><rect x="1.5" y="2" width="9" height="8" rx="1"/><path d="M4 4.2h4M4 6h2.2M4 7.8h1.4"/></svg><span>Providers</span></a>
      <a class="nav abs" href="/users" style="top:162.5px"><svg class="i" viewBox="0 0 12 12"><circle cx="4.2" cy="4" r="1.7"/><path d="M1.3 9.6c0-1.7 1.3-2.9 2.9-2.9s2.9 1.2 2.9 2.9"/><circle cx="8.4" cy="4.3" r="1.4"/><path d="M8 6.8c1.5-.1 2.7.9 2.8 2.5"/></svg><span>Users</span></a>
      <a class="nav abs" href="/billing" style="top:192px"><svg class="i" viewBox="0 0 12 12"><rect x="1.2" y="2.6" width="9.6" height="6.8" rx="1"/><path d="M1.2 4.7h9.6"/></svg><span>Billing</span></a>

const BOLT='<svg class="i" viewBox="0 0 12 12"><path d="M7 1L3 6.6h3L5 11l4-5.6H6L7 1z"/></svg>';
const SPK='<svg class="i" viewBox="0 0 12 12"><path d="M1.8 4.6h2L6.6 2.2v7.6L3.8 7.4h-2z"/><path d="M8.2 4.2c.8.9.8 2.7 0 3.6M9.6 3c1.5 1.6 1.5 4.400 0 6"/></svg>';

let sel=2, tab='c', view='a', q='', open=true;
const vis=()=>DATA.filter(d=>(view==='a'?d.status==='Active':d.status!=='Active')&&(d.name+' '+d.addr).toLowerCase().includes(q.toLowerCase()));
const byId=id=>DATA.find(d=>d.id===id);

function renderList(){
  const L=$('#list'), items=vis(), E=$('#empty');
  L.innerHTML=items.map(d=>`<button type="button" class="card ${d.id===sel?'sel':''}" data-id="${d.id}">
    <img class="ph" src="${d.img}" alt="Room photo – ${d.name}">
    <div class="nm"><b>${d.name}</b><span class="stars">${[0,1,2,3,4].map(i=>star(i>=d.stars)).join('')}</span></div>
    <div class="ad">${PIN}<span>${d.addr}</span></div>
    <div class="st s1">${DOOR}<div class="t"><span class="l">Door</span><span class="v">${d.door}</span></div></div>
    <div class="st s2">${BOLT}<div class="t"><span class="l">Avg. energy usage</span><span class="v">${d.kwh} kWh</span></div></div>
    <div class="st s3">${SPK}<div class="t"><span class="l">Noise level</span><span class="v">${d.db} dB</span></div></div>
  </button>`).join('');
  E.hidden=items.length>0;
  if(!items.length) E.textContent=view==='i'?'No inactive listings.':'No listings match your search.';
  L.querySelectorAll('.card').forEach(c=>c.addEventListener('click',()=>select(+c.dataset.id)));
}
function digits(s,k){return `<div class="digits">${[...s].map(x=>`<span class="dg ${k}">${x}</span>`).join('')}</div>`}
function renderRows(d){
  const R=$('#rows');
  if(tab==='c') R.innerHTML=
    `<div class="row"><span class="lb">Access code</span>${digits(d.codes.a,'a')}</div>
     <div class="row"><span class="lb">Owner code</span>${digits(d.codes.o,'o')}</div>
     <div class="row"><span class="lb">Cleaner code</span>${digits(d.codes.c,'c')}</div>`;
  else if(tab==='d') R.innerHTML=
    `<div class="row"><span class="lb">Door</span><button type="button" class="pill" id="lock">${d.door}</button></div>
     <div class="row"><span class="lb">Avg. energy usage</span><span class="vv">${d.kwh} kWh</span></div>
     <div class="row"><span class="lb">Noise level</span><span class="vv">${d.db} dB</span></div>`;
  else R.innerHTML=
    `<div class="row"><span class="lb">Guest</span><span class="vv">${d.guest.n}</span></div>
     <div class="row"><span class="lb">Stay</span><span class="vv">${d.ci} – ${d.co}</span></div>
     <div class="row"><span class="lb">Guests</span><span class="vv">${d.gs}</span></div>`;
  const lk=$('#lock'); if(lk) lk.onclick=()=>{d.door=d.door==='Locked'?'Unlocked':'Locked';renderRows(d);renderList()};
}
function fillPanel(){
  const d=byId(sel);
  $('#ptitle').textContent=d.name;
  placeBadge();
  $('#paddrt').textContent=d.addr;
  const av=$('#av'); av.innerHTML=d.guest.av?`<img src="${d.guest.av}" alt="">`:d.guest.n.split(' ').map(w=>w[0]).join('');
  $('#gn').textContent=d.guest.n; $('#gl').textContent=d.guest.l;
  $('#ci').textContent=d.ci; $('#co').textContent=d.co; $('#gs').textContent=d.gs;
  renderRows(d);
}
function select(id,instant){
  sel=id; open=true; $('#panel').classList.remove('closed');
  document.querySelectorAll('.card').forEach(c=>c.classList.toggle('sel',+c.dataset.id===id));
  const body=$('#pbody');
  if(instant){fillPanel();return}
  body.classList.add('out');
  setTimeout(()=>{fillPanel();body.classList.remove('out')},110);
}
function step(n){
  const items=vis(); if(!items.length) return;
  let i=items.findIndex(d=>d.id===sel); i=i<0?0:(i+n+items.length)%items.length;
  select(items[i].id);
}
function setTab(t){
  tab=t; ['c','d','b'].forEach(k=>$('#t-'+k).setAttribute('aria-selected',k===t)); renderRows(byId(sel));
}
function setView(v){
  view=v; $('#tab-a').setAttribute('aria-selected',v==='a'); $('#tab-i').setAttribute('aria-selected',v==='i'); renderList();
}
$('#t-c').onclick=()=>setTab('c'); $('#t-d').onclick=()=>setTab('d'); $('#t-b').onclick=()=>setTab('b');
$('#tab-a').onclick=()=>setView('a'); $('#tab-i').onclick=()=>setView('i');
$('#k-prev').onclick=()=>step(-1); $('#k-next').onclick=()=>step(1);
$('#k-esc').onclick=()=>{open=false;$('#panel').classList.add('closed')};
$('#q').addEventListener('input',e=>{q=e.target.value;renderList()});
document.addEventListener('keydown',e=>{
  const typing=document.activeElement&&document.activeElement.id==='q';
  if(e.key==='Escape'){ if(typing&&q){return} open=false;$('#panel').classList.add('closed'); }
  else if(!typing&&e.key==='ArrowLeft'){e.preventDefault();step(-1)}
  else if(!typing&&e.key==='ArrowRight'){e.preventDefault();step(1)}
});
let mode='l';
function fit(){
  const st=$('#stage'), vw=document.body.clientWidth, vh=document.body.clientHeight;
  if(vw<760){
    document.body.className='phone';
    st.style.left='0'; st.style.top='0'; st.style.width='100%'; st.style.height='auto';
    st.style.transform='none';
    st.style.setProperty('--fs','1.35');
    placeBadge();
    return;
  }
  document.body.className=mode==='s'?'':'big m-'+mode;
  if(mode==='s'){
    const s=Math.min(vw/736,vh/552);
    st.style.left='50%'; st.style.top='50%'; st.style.width='736px'; st.style.height='552px';
    st.style.setProperty('--WW','660px'); st.style.setProperty('--H','409px'); st.style.setProperty('--dy','0px'); st.style.setProperty('--fs','1');
    st.style.transform=`translate(-50%,-50%) scale(${s})`;
  }else{
    const pd=mode==='l'?10:0, aw=vw-2*pd, ah=vh-2*pd;
    const s=Math.max(.35,Math.min(ah/409,1.6,aw/640)), W=aw/s, H=ah/s;
    st.style.left=pd+'px'; st.style.top=pd+'px'; st.style.width=W+'px'; st.style.height=H+'px';
    st.style.setProperty('--WW',W+'px'); st.style.setProperty('--H',H+'px'); st.style.setProperty('--dy',(H-409)+'px'); st.style.setProperty('--fs','1.25');
    st.style.transform=`scale(${s})`;
  }
  document.querySelectorAll('#sizer button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.m===mode));
  placeBadge();
}
function placeBadge(){
  const t=$('#ptitle'); const w=t.offsetWidth; $('#badge').style.left=(15+w+10.5)+'px';
}
window.addEventListener('resize',fit);
document.querySelectorAll('#sizer button').forEach(b=>b.onclick=()=>{mode=b.dataset.m;fit()});
const syncPop=()=>$('#win').classList.toggle('pop',!$('#panel').classList.contains('closed'));
new MutationObserver(syncPop).observe($('#panel'),{attributes:true,attributeFilter:['class']}); syncPop();
renderList(); fillPanel(); fit();
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(placeBadge);
</script>
<script src="/js/pwa.js"></script>
</body>
</html>
