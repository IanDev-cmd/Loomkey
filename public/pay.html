<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2e1aba">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Loomkey">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="icon" href="/icons/icon-192.png">
<title>Loomkey — Pay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/console.css">
</head>
<body>
<div id="shell">
<aside id="side"></aside>
<main id="main" class="narrow">
  <header class="top"><div><h1 id="pay-title">Pay booking</h1><p class="lede"><a href="/billing">Back to billing</a></p></div></header>
  <article class="card">
    <form id="pay-form">
      <div class="fields">
        <label>Name<input data-guest-name name="name" required value="Lena Hoffmann"></label>
        <label>Email<input data-guest-email name="email" type="email" required value="lena@example.com"></label>
        <label>Phone<input data-guest-phone name="phone" value="0712345678"></label>
        <label>Country<input data-guest-country name="country" value="Kenya"></label>
      </div>
      <div class="actions">
        <button class="btn" type="button" data-pay-booking="" data-pay-kind="full">Pay full</button>
        <button class="btn ghost" type="button" data-pay-booking="" data-pay-kind="deposit">Pay deposit</button>
        <button class="btn ghost" type="button" data-pay-booking="" data-pay-kind="balance">Pay balance</button>
      </div>
    </form>
    <p id="status" role="status"></p>
  </article>
  <section class="qr-grid" data-qr-block>
    <article class="card qr-card">
      <h2>Payment QR</h2>
      <img data-qr="pay" data-booking="BK-1042" width="196" height="196" alt="QR code for booking payment">
      <p class="mute">Scan to open this payment on a phone.</p>
      <p class="mute" data-pay-url></p>
    </article>
    <article class="card qr-card">
      <h2>Install on Chrome</h2>
      <img data-qr="install" width="196" height="196" alt="QR code that opens Loomkey so Chrome can install it">
      <p class="mute">Scan to open the install page. Chrome will offer to install Loomkey.</p>
      <div class="actions"><button class="btn" type="button" data-install>Install app</button><button class="btn ghost" type="button" data-enable-push>Enable notifications</button></div>
    </article>
  </section>
</main>
</div>
<script src="/js/nav.js"></script>
<script src="/js/session.js"></script>
<script src="/config.js"></script>
<script src="/js/loomkey-flutterwave.js"></script>
<script src="/js/pay-page.js"></script>
<script src="/js/pwa.js"></script>
</body>
</html>
